seed: 0
data:
  corpus_dir: runs/qm9_10k_dag_corpus
diffusion:
  timesteps: 200
  node_noise_scale: 0.01
  denoiser_evaluations: 32
  node_corruption: mixed_state
  level0_atom_categorical: true
  binary_object_logits: true
  categorical_activity: true
  categorical_reverse_posterior: true
  activity_capacity_mask: true
  factorized_edge_activity_posterior: true
model:
  hidden_dim: 192
  num_layers: 4
  guide_num_layers: 2
  num_heads: 6
  dropout: 0.1
train:
  run_dir: runs/qm9_10k_dag_train
  device: cuda
  epochs: 100
  batch_size: 64
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  cond_drop_prob: 0.1
  global_drop_prob: 0.1
loss:
  node: 1.0
  edge: 1.0
  active: 0.25
  split: 0.05
  attachment: 0.05
  consistency: 0.1
representation:
  max_nodes: 32
  node_feature_dim: 21
  edge_categories: 5
  encoder_hidden_dim: 128
  encoder_layers: 2
  encoder_heads: 4
  encoder_dropout: 0.1
  codebook_size: 512
  code_dim: 128
  commitment_weight: 0.25
  epochs: 1
  loss:
    reconstruction: 1.0
    topology: 0.05
    vq: 1.0
    commitment: 0.25
    hash: 0.05
global_dag:
  level_augmented: true
  transition_temperature: 1.0
  max_path_edges: 8
sampling:
  guidance_scale: 1.3
  edge_temperature: 0.9
  no_edge_logit_bias: 2.0
  max_degree: 4
  refinement_retries: 2
certification:
  recontract_all_requested_levels: true
  exact_requires_full_certificate: true
